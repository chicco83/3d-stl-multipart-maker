<!doctype html>
<!-- ==========================================================================
     3D STL Multipart Maker — index.html
     Versione: 0.7.0-beta — 2026-10-08 12:00
     Struttura dell'interfaccia: barra superiore, barra strumenti a sinistra,
     vista 3D al centro (canvas + overlay SVG per i disegni), pannello
     opzioni/parti a destra, barra di stato in basso.
     ========================================================================== -->
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- [2026-09-28 v0.4.1] il commento con il vecchio tag del titolo (v0.2.0, nome precedente)
     veniva letto dalle anteprime link (WhatsApp ecc.) come titolo: rimosso. -->
<title>3D STL Multipart Maker</title>
<!-- v0.4.1: metadati per anteprime link (Open Graph / Twitter) e motori di ricerca -->
<meta name="description" content="Dividi modelli 3D troppo grandi per la stampante in parti stampabili, con perni, tenoni o magneti e guida di montaggio. Gratis, tutto nel browser.">
<meta name="theme-color" content="#14171d">
<meta property="og:type" content="website">
<meta property="og:site_name" content="3D STL Multipart Maker">
<meta property="og:title" content="3D STL Multipart Maker">
<meta property="og:description" content="Dividi modelli STL/3MF in parti stampabili con giunti e guida di montaggio. Tutto nel browser, nessun upload.">
<meta property="og:url" content="https://chicco83.github.io/3d-stl-multipart-maker/">
<meta property="og:image" content="https://chicco83.github.io/3d-stl-multipart-maker/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:locale" content="it_IT">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="icon.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header id="top">
  <!-- [2026-09-28 v0.2.0] intestazione precedente: logo + nome "Model Splitter" (grassetto) + "Evo" (colorato) -->
  <div class="brand"><img src="icon.png" alt=""><b>3D STL</b><span>Multipart Maker</span><em id="ver"></em></div>
  <button data-act="open" title="Apri STL / 3MF / OBJ / progetto (Ctrl+O)">Apri</button>
  <button data-act="saveProject" title="Salva il progetto (Ctrl+S)">Salva</button>
  <button data-act="undo" title="Annulla (Ctrl+Z)">&#8630; Annulla</button>
  <button data-act="redo" title="Ripeti (Ctrl+Shift+Z)">&#8631; Ripeti</button>
  <span class="sep"></span>
  <button data-act="frame" title="Inquadra tutto (F)">Inquadra</button>
  <button data-act="view" data-v="iso">Iso</button>
  <button data-act="view" data-v="top">Alto</button>
  <button data-act="view" data-v="front">Fronte</button>
  <button data-act="view" data-v="right">Destra</button>
  <span class="sep"></span>
  <label class="explode">Esplodi <input type="range" id="explode" min="0" max="1.5" step="0.01" value="0"></label>
  <span class="grow"></span>
  <button data-act="tool" data-tool="settings" title="Stampante e preferenze">Stampante</button>
  <!-- [2026-09-28 v0.5.0] pulsante "?" che apriva lo strumento Guida rapida (scorciatoie) -->
  <!-- v0.5.1: il pulsante "?" apre il manuale completo (F1) -->
  <button data-act="manual" title="Manuale (F1)">? Manuale</button>
  <!-- v0.6.0: selettore lingua (escluso dalla traduzione automatica) -->
  <button id="langBtn" data-act="lang" data-noi18n>🌐 IT</button>
</header>

<nav id="tools"></nav>

<main id="view">
  <!-- v0.5.0: barra dei passi della procedura guidata -->
  <div id="steps"></div>
  <svg id="overlay"></svg>
  <div id="drop" class="hidden">Rilascia qui i file STL / 3MF / OBJ / progetto</div>
  <div id="empty"><div><h2>Trascina un modello qui</h2><p>STL, 3MF oppure OBJ — oppure premi <b>Apri</b>.</p><p class="small">Tasto destro: orbita · Centrale: sposta · Rotella: zoom</p><button data-act="demo">Carica modello di prova</button></div></div>
  <div id="brushCursor" class="hidden"></div>
</main>

<aside id="panel">
  <section id="toolpanel"></section>
  <!-- v0.2.0: splitter per ridimensionare la sezione Parti -->
  <div id="splitter" title="Trascina per ridimensionare la sezione Parti (doppio click = ripristina)"></div>
  <section id="partsbox">
    <div class="ph"><b>Parti</b><span id="partcount"></span><span class="grow"></span>
      <button class="mini" data-act="selall" title="Seleziona tutto (Ctrl+A)">Tutte</button>
      <button class="mini" data-act="selnone" title="Deseleziona (Esc)">Nessuna</button></div>
    <ul id="parts"></ul>
  </section>
</aside>

<footer id="status"><span id="hint"></span><span class="grow"></span><span id="info"></span></footer>

<div id="busy" class="hidden"><div class="spin"></div><div id="busytxt">Elaborazione…</div></div>
<div id="toasts"></div>
<input type="file" id="file" multiple accept=".stl,.3mf,.obj,.stlmp" hidden>
<script type="module" src="app.js"></script>
</body>
</html>
